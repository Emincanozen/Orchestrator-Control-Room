[project]
name = "ai-orchestrator"
version = "5.0.0"
description = "Local-first multi-agent AI orchestration platform"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.0",
    "httpx>=0.27",
    "psutil>=6.0",
]

[project.scripts]
orchestrator = "orchestrator.cli.main:app"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not smoke'"
markers = ["smoke: real CLI calls that spend provider quota (opt-in)"]

[tool.ruff]
line-length = 120
target-version = "py312"
